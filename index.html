<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>Anniyan.com</title>

    <link rel="stylesheet" href="styles.css">

    <!-- Tamil Fonts -->

    <link href="https://fonts.googleapis.com/css2?family=Creepster&display=swap"
    rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Baloo+Thambi+2:wght@700&display=swap"
    rel="stylesheet">

</head>

<body>


    <!-- LOGO -->

    <div id="logo-container">

        <img id="logo"
        src="Green_Cute_Tea_Plantation_Text_Logo-removebg-preview.png"
        alt="anniyan.com">

    </div>



    <!-- PLAY BUTTON -->

    <button id="playButton">

        💀 அண்ணியன்.com கு வரவேற்கிறேன்,
        இங்கு நீங்கள் உங்கள் பிரச்சினைகளை
        சமர்ப்பிக்கலாம் 💀

    </button>



    <!-- VIDEO SECTION -->

    <div id="videoContainer"
    style="display: none;">

        <video id="introVideo">

            <source src="annayan.mov"
            type="video/mp4">

            Your browser does not support video.

        </video>


        <!-- SKIP BUTTON -->

        <button id="skipButton">

            Skip Intro

        </button>

    </div>



    <!-- MAIN CONTENT -->

    <div id="mainContent"
    class="hidden">

        <div class="container">

            <h1>குற்றவாளியின் தகவல்</h1>

            <form id="reportForm">

                <!-- NAME -->

                <label for="name">

                    குற்றவாளியின் பெயர்:

                </label>

                <input type="text"
                id="name"
                placeholder="பெயரை உள்ளிடவும்"
                required>



                <!-- AGE -->

                <label for="age">

                    குற்றவாளியின் வயது:

                </label>

                <input type="number"
                id="age"
                placeholder="வயதை உள்ளிடவும்"
                required>



                <!-- PROBLEM -->

                <label for="problem">

                    சொல்ல வேண்டிய பிரச்சினை:

                </label>

                <textarea id="problem"
                rows="5"
                placeholder="பிரச்சினையை விவரிக்கவும்..."
                required></textarea>



                <!-- SUBMIT -->

                <button type="submit">

                    அனுப்பவும்

                </button>

            </form>


            <!-- SUCCESS MESSAGE -->

            <p id="message"></p>

        </div>

    </div>



    <!-- MODAL -->

    <div id="punishmentModal"
    class="hidden">

        <div class="modal-content">

            <p id="punishmentMessage"></p>

            <button id="refreshButton"
            class="hidden">

                புதிய புகார்

            </button>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
